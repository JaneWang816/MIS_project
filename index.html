<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>資管系器材借用系統</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>資管系器材借用系統</h1>
    <p>系上相機、投影機等器材，線上查詢、借用一次搞定。</p>
  </header>

  <main>
    <section>
      <h2>可借用器材</h2>
      <div class="cards">
        <div class="card">
          <h3>相機</h3>
          <p>適合拍攝活動紀錄與課堂作業。</p>
        </div>
        <div class="card">
          <h3>投影機</h3>
          <p>適合社團活動、讀書會與小型簡報。</p>
        </div>
        <div class="card">
          <h3>麥克風</h3>
          <p>適合演講、主持與錄音。</p>
        </div>
        <div class="card">
          <h3>腳架</h3>
          <p>可搭配相機或手機使用。</p>
        </div>
      </div>
    </section>

    <section>
      <h2>借用規則</h2>
      <ul class="rules">
        <li>每次借用最長 7 天，請於期限內歸還。</li>
        <li>借用與歸還請至系辦辦理，並當場檢查器材狀況。</li>
        <li>器材如有損壞或遺失，請立即告知系辦。</li>
        <li>逾期未還者，暫停借用權利一個月。</li>
      </ul>
    </section>

    <section class="notice">
      <p>線上查詢器材狀態功能即將推出。</p>
    </section>
  </main>

  <footer>
    <p>資訊管理學系 系辦公室</p>
  </footer>
</body>
</html>
